services:
  # This repo only ships capy-semantic-service (ai-service + worker + shared).
  # Your NestJS backend + Postgres + Redis already exist elsewhere.

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: capy_ai_service
    environment:
      # Keep workers <= 2 for 4GB VPS survival mode
      AI_WORKERS: ${AI_WORKERS:-1}
      ONNX_MODEL_PATH: ${ONNX_MODEL_PATH:-artifacts/onnx/model-int8.onnx}
      TOKENIZER_JSON_PATH: ${TOKENIZER_JSON_PATH:-artifacts/onnx/tokenizer.json}
      LABEL_MAP_PATH: ${LABEL_MAP_PATH:-artifacts/phobert_textcls/label_map.json}
      MAX_LENGTH: ${MAX_LENGTH:-128}
    ports:
      - "${AI_PORT:-8001}:8001"
    mem_limit: 512m

  # Optional one-shot worker (export dataset from Postgres to CSV/Parquet)
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: capy_worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
    profiles: ["worker"]
    mem_limit: 512m

  # Optional local dependencies for dev only. Not started by default.
  postgres:
    image: postgres:15-alpine
    container_name: capy_postgres
    profiles: ["local-deps"]
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: capy_redis
    profiles: ["local-deps"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    mem_limit: 256m

volumes:
  postgres_data:
  # hf_cache:

