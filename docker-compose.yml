services:
  postgres:
    image: postgres:15-alpine
    container_name: capy_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: capy_app
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HF_HOME: ${HF_HOME}
      MODEL_DIR: ${MODEL_DIR}
    volumes:
      - .:/app
      - hf_cache:/cache
    ports:
      - "${APP_PORT}:${APP_INTERNAL_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -lc "uvicorn api:app --host ${APP_HOST} --port ${APP_INTERNAL_PORT} ${UVICORN_RELOAD}"

volumes:
  postgres_data:
  hf_cache:

